# https://github.com/marketplace/actions/setup-clojure#usage

name: Tests

on:
  push:
    branches: [master]
  # Every pull request, including one stacked on another branch.
  pull_request:

jobs:

  clojure:

    strategy:
      matrix:
        os: [ubuntu-latest] # [ubuntu-latest, macOS-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # The tests in test/pine/db run on SQLite, MySQL and Postgres. These are
    # the same images scripts/test-databases.sh starts locally.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pine
          POSTGRES_PASSWORD: pine
          POSTGRES_DB: pine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pine"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pine
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppine --silent"
          --health-interval 2s --health-timeout 5s --health-retries 60

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # It is important to install java before installing clojure tools which needs java
      # exclusions: babashka, clj-kondo and cljstyle
      - name: Prepare java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@11.0
        with:
          # Install just one or all simultaneously
          # The value must indicate a particular version of the tool, or use 'latest'
          # to always provision the latest version
          cli: 1.11.3.1463               # Clojure CLI based on tools.deps
          # lein: 2.8.3                    # Leiningen
          # boot: 2.8.3                  # Boot.clj
          # bb: 0.7.8                    # Babashka
          # clj-kondo: 2022.05.31        # Clj-kondo
          # cljfmt: 0.10.2               # cljfmt
          # cljstyle: 0.15.0             # cljstyle
          # cmd-exe-workaround: 'latest' # Replaces `clojure` with `deps.clj` on Windows
          # zprint: 1.2.3                # zprint

      # Optional step:
      - name: Cache clojure dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # List all files containing dependencies:
          key: cljdeps-${{ hashFiles('deps.edn') }}
          # key: cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          # key: cljdeps-${{ hashFiles('project.clj') }}
          # key: cljdeps-${{ hashFiles('build.boot') }}
          restore-keys: cljdeps-

      # - name: Execute clojure code
      #   run: clojure -e "(+ 1 1)"

      # - name: Get leiningen version
      #   run: lein -v

      # - name: Get boot version
      #   run: boot -V

      # - name: Get babashka version
      #   run: bb --version

      # - name: Get clj-kondo version
      #   run: clj-kondo --version

      # - name: Get cljfmt version
      #   run: cljfmt --version

      # - name: Get cljstyle version
      #   # cljstyle is not yet available for windows
      #   if: ${{ matrix.os != 'windows-latest' }}
      #   run: cljstyle version

      # - name: Get zprint version
      #   run: zprint --version

      - name: Check version sync
        run: ./scripts/check-version-sync.sh

      - name: Check format
        run: clojure -M:fmt check

      - name: Run tests
        run: clojure -M:test
        env:
          # A missing server fails the run instead of skipping its tests.
          PINE_TEST_REQUIRE_SERVERS: "1"
          PINE_TEST_POSTGRES_URL: postgres://pine:pine@localhost:5432/pine
          PINE_TEST_MYSQL_URL: mysql://root:pine@localhost:3306/mysql

      # The desktop app and the Docker image run pine-lang ahead-of-time
      # compiled. That can fail where the tests pass, as 0.48.0 did ("File
      # name too long" from a large core.match), so build the jar here too.
      - name: Build the standalone jar
        run: clojure -T:build uber
